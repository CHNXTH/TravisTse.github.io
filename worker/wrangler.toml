name = "travis-ai-chat"
main = "src/index.js"
compatibility_date = "2026-04-30"
workers_dev = true

[observability.logs]
enabled = true

[secrets]
required = ["DEEPSEEK_API_KEY", "ADMIN_SESSION_SECRET", "ADMIN_BOOTSTRAP_PASSWORD"]

[[kv_namespaces]]
binding = "SITE_DATA"
id = "5344b320707c4bcb84e6524217cdb7f2"

# Note: This project stores uploaded images in Workers KV (SITE_DATA) by default
# so it works even when R2 is not enabled on the account.

# Copy-on-first-read storage; the original KV content and uploaded assets remain intact.
[[durable_objects.bindings]]
name = "CONTENT_COORDINATOR"
class_name = "ContentCoordinator"

[[migrations]]
tag = "v1-content-coordinator"
new_sqlite_classes = ["ContentCoordinator"]
